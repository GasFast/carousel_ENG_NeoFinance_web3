<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Carousel Web3</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap');

  :root {
    --color-background-primary: #ffffff;
    --color-background-secondary: #f1f5f9;
    --color-border-secondary: #cbd5e1;
    --color-text-primary: #0f172a;
    --color-text-secondary: #64748b;
    --border-radius-md: 10px;
    --border-radius-lg: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #f8fafc;
    padding: 12px;
  }

  .carousel-wrap {
    padding: 1rem 0;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .controls button {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    padding: 6px 16px;
    font-size: 13px;
    cursor: pointer;
    color: var(--color-text-primary);
  }

  .controls button:disabled { opacity: 0.3; }

  .slide-counter {
    font-size: 13px;
    color: var(--color-text-secondary);
    min-width: 60px;
    text-align: center;
  }

  .slide-viewport {
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 540px;
    margin: 0 auto;
    position: relative;
    border-radius: var(--border-radius-lg);
    overflow: hidden;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: space-between;
    padding: 36px;
  }

  .slide.active { display: flex; }

  .s1, .s-dark { background: #0a0f1e; color: #fff; }

  .slide-title span { color: #6ee7b7; }

  .pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

  .pill {
    background: #1e293b;
    border: 0.5px solid #334155;
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 12px;
    color: #94a3b8;
  }

  .pill.accent { background: #064e3b; color: #6ee7b7; }

  /* 🔴 FIX MÓVIL */
  @media (max-width: 600px) {

    .slide-viewport {
      aspect-ratio: auto;
      height: 80vh;
      max-height: 680px;
    }

    .slide {
      padding: 26px;
      overflow-y: auto;
    }

    .slide-title {
      font-size: 30px;
    }

    .slide-body {
      font-size: 15px;
      line-height: 1.5;
    }

    .pill {
      font-size: 12px;
      padding: 5px 10px;
    }
  }

</style>
</head>

<body>

<div class="carousel-wrap">

  <div class="slide-viewport">

    <div class="slide s1 active">
      <h1>How blockchain can <span>finance real-world</span> industry</h1>
      <p>Swipe to discover</p>
    </div>

    <div class="slide s-dark">
      <div class="slide-title">US tariffs.<br>Now <span>what?</span></div>
    </div>

    <div class="slide s-dark">
      <div class="slide-title">This is not a<br><span>funding</span> problem</div>

      <div class="pill-row">
        <div class="pill">production in Europe</div>
        <div class="pill">shipment to Mexico</div>
        <div class="pill">assembly</div>
        <div class="pill">US distribution</div>
        <div class="pill accent">delayed collection</div>
      </div>
    </div>

  </div>

  <div class="controls">
    <button id="prev-btn" onclick="changeSlide(-1)">Prev</button>
    <span class="slide-counter" id="counter">1 / 3</span>
    <button id="next-btn" onclick="changeSlide(1)">Next</button>
  </div>

</div>

<script>
let current = 0;
const slides = document.querySelectorAll('.slide');

function changeSlide(dir) {
  slides[current].classList.remove('active');
  current = Math.max(0, Math.min(slides.length - 1, current + dir));
  slides[current].classList.add('active');
  document.getElementById('counter').textContent = (current + 1) + ' / ' + slides.length;
}
</script>

</body>
</html>
